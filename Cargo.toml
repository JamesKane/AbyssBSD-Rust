[workspace]
resolver = "3"
members = [
    "xtask",
    "arch/aarch64",
    "arch/hal",
    "arch/x86_64",
    "boot/bootproto",
    "boot/efi",
    "boot/loader-efi",
    "drivers/fb-console",
    "drivers/uart-16550",
    "drivers/uart-pl011",
    "kernel",
    "lib/abi",
    "lib/acpi-tables",
    "lib/addr",
    "lib/aml",
    "lib/crc",
    "lib/demangle",
    "lib/devtree",
    "lib/elf",
    "lib/fat",
    "lib/font",
    "lib/gpt",
    "lib/guid",
    "lib/ktest",
    "lib/logring",
    "lib/pt",
    "lib/regs",
    "sys/bus",
    "sys/irq",
    "sys/pci",
    "sys/sched",
    "sys/sync",
    "sys/sysctl",
    "sys/vm",
    "tools/syscallgen",
]
# Firmware and kernel binaries only build for their own targets; everything
# else runs on the host and is what a bare `cargo test` exercises.
default-members = [
    "xtask",
    "arch/hal",
    "boot/bootproto",
    "boot/efi",
    "drivers/fb-console",
    "drivers/uart-16550",
    "drivers/uart-pl011",
    "lib/abi",
    "lib/acpi-tables",
    "lib/addr",
    "lib/aml",
    "lib/crc",
    "lib/demangle",
    "lib/devtree",
    "lib/elf",
    "lib/fat",
    "lib/font",
    "lib/gpt",
    "lib/guid",
    "lib/ktest",
    "lib/logring",
    "lib/pt",
    "lib/regs",
    "sys/bus",
    "sys/irq",
    "sys/pci",
    "sys/sched",
    "sys/sync",
    "sys/sysctl",
    "sys/vm",
    "tools/syscallgen",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.dev]
panic = "abort"
opt-level = 1

# docs/ENGINEERING.md §1: the kernel is optimized even in debug builds.
[profile.dev.package.kernel]
opt-level = 2

[profile.release]
panic = "abort"
debug = true
lto = "fat"
codegen-units = 1
