[workspace.package]
version = "0.0.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.dev]
panic = "abort"
opt-level = 1

# docs/ENGINEERING.md §1: the kernel is optimized even in debug builds.
[profile.dev.package.kernel]
opt-level = 2

[profile.release]
panic = "abort"
debug = true
lto = "fat"
codegen-units = 1
