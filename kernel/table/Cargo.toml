[package]
name = "driver-table"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The drivers in every ISA's table.
[dependencies]
acpi-platform = { path = "../../lib/acpi-platform" }
ahci = { path = "../../drivers/ahci" }
acpi = { path = "../../sys/acpi" }
bus = { path = "../../sys/bus" }
cpufreq = { path = "../../sys/cpufreq" }
hidbus = { path = "../../sys/hid" }
hkbd = { path = "../../drivers/hkbd" }
hms = { path = "../../drivers/hms" }
iicbus = { path = "../../sys/iicbus" }
nvme = { path = "../../drivers/nvme" }
pci = { path = "../../sys/pci" }
rge = { path = "../../drivers/rge" }
uart = { path = "../../drivers/uart" }
umass = { path = "../../drivers/umass" }
usbus = { path = "../../sys/usb" }
virtio = { path = "../../sys/virtio" }
virtio-blk = { path = "../../drivers/virtio-blk" }
virtio-net = { path = "../../drivers/virtio-net" }
virtio-input = { path = "../../drivers/virtio-input" }
virtio-random = { path = "../../drivers/virtio-random" }
xhci-driver = { path = "../../drivers/xhci" }

# The x86_64 kernel's own, and every host build's (docs/MODULES.md §3.2).
[target.'cfg(any(target_arch = "x86_64", not(target_os = "none")))'.dependencies]
amdsbwd = { path = "../../drivers/amdsbwd" }
atrtc = { path = "../../drivers/atrtc" }
ichwd = { path = "../../drivers/ichwd" }
isa = { path = "../../drivers/isa" }
timers = { path = "../../drivers/timers" }

# The aarch64 kernel's own, and every host build's.
[target.'cfg(any(target_arch = "aarch64", not(target_os = "none")))'.dependencies]
cix-sky1 = { path = "../../platform/cix-sky1" }
cdnc-i2c = { path = "../../drivers/cdnc-i2c" }
cdns-gpio = { path = "../../drivers/cdns-gpio" }
gpiobus = { path = "../../sys/gpio" }
cix-mbox = { path = "../../drivers/cix-mbox" }
sbsa-gwdt = { path = "../../drivers/sbsa-gwdt" }
sky1-clk = { path = "../../drivers/sky1-clk" }
sky1-pinctrl = { path = "../../drivers/sky1-pinctrl" }
sky1-reset = { path = "../../drivers/sky1-reset" }
sky1-syscon = { path = "../../drivers/sky1-syscon" }
smmu = { path = "../../drivers/smmu" }

[dev-dependencies]
aml = { path = "../../lib/aml" }
acpi-corpus = { path = "../../lib/acpi-corpus" }
devtree = { path = "../../lib/devtree" }

[lints]
workspace = true
