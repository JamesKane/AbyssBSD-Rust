[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Runs the in-kernel tests instead of the normal boot path.
ktest = []

[dependencies]
abi = { path = "../lib/abi" }
acpi-tables = { path = "../lib/acpi-tables" }
addr = { path = "../lib/addr" }
bootproto = { path = "../boot/bootproto" }
bus = { path = "../sys/bus" }
devtree = { path = "../lib/devtree" }
pci = { path = "../sys/pci" }
acpi = { path = "../sys/acpi" }
driver-table = { path = "table" }
virtio-random = { path = "../drivers/virtio-random" }
demangle = { path = "../lib/demangle" }
efi = { path = "../boot/efi" }
elf = { path = "../lib/elf" }
fb-console = { path = "../drivers/fb-console" }
hal = { path = "../arch/hal" }
irq = { path = "../sys/irq" }
ktest = { path = "../lib/ktest" }
logring = { path = "../lib/logring" }
pt = { path = "../lib/pt" }
regs = { path = "../lib/regs" }
sched = { path = "../sys/sched" }
sync = { path = "../sys/sync" }
sysctl = { path = "../sys/sysctl" }
uart-16550 = { path = "../drivers/uart-16550" }
uart-pl011 = { path = "../drivers/uart-pl011" }
vm = { path = "../sys/vm" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { path = "../arch/x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { path = "../arch/aarch64" }

[lints]
workspace = true
