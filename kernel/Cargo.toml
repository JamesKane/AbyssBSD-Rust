[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Runs the in-kernel tests instead of the normal boot path.
ktest = []

[dependencies]
bufcache = { path = "../sys/bufcache" }
fat = { path = "../lib/fat" }
geom = { path = "../lib/geom" }
gpt = { path = "../lib/gpt" }
abi = { path = "../lib/abi" }
acpi-tables = { path = "../lib/acpi-tables" }
addr = { path = "../lib/addr" }
intmap = { path = "../lib/intmap" }
bootproto = { path = "../boot/bootproto" }
bus = { path = "../sys/bus" }
evdev = { path = "../sys/evdev" }
input = { path = "../sys/input" }
vt = { path = "../sys/vt" }
clock = { path = "../sys/clock" }
devtree = { path = "../lib/devtree" }
pci = { path = "../sys/pci" }
acpi = { path = "../sys/acpi" }
aml = { path = "../lib/aml" }
driver-table = { path = "table" }
random = { path = "../sys/random" }
sbsa-gwdt = { path = "../drivers/sbsa-gwdt" }
storage = { path = "../sys/storage" }
ufs = { path = "../lib/ufs" }
virtio-random = { path = "../drivers/virtio-random" }
watchdog = { path = "../sys/watchdog" }
demangle = { path = "../lib/demangle" }
efi = { path = "../boot/efi" }
elf = { path = "../lib/elf" }
ustar = { path = "../lib/ustar" }
fb-console = { path = "../drivers/fb-console" }
hal = { path = "../arch/hal" }
irq = { path = "../sys/irq" }
event = { path = "../sys/event" }
ktest = { path = "../lib/ktest" }
logring = { path = "../lib/logring" }
pt = { path = "../lib/pt" }
regs = { path = "../lib/regs" }
sched = { path = "../sys/sched" }
security = { path = "../sys/security" }
socket = { path = "../sys/socket" }
inet = { path = "../sys/inet" }
sync = { path = "../sys/sync" }
sysctl = { path = "../sys/sysctl" }
tty = { path = "../sys/tty" }
umtx = { path = "../sys/umtx" }
uart = { path = "../drivers/uart" }
uart-16550 = { path = "../drivers/uart-16550" }
uart-pl011 = { path = "../drivers/uart-pl011" }
vfs = { path = "../sys/vfs" }
vm = { path = "../sys/vm" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { path = "../arch/x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { path = "../arch/aarch64" }
idregs = { path = "../lib/idregs" }

[lints]
workspace = true
